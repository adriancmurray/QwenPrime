<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Qwen Prime app icon</title>
  <description id="description">A minimal Q-shaped inference loop with a forward tail and three speculative token nodes.</description>
  <defs>
    <linearGradient id="background" x1="160" y1="128" x2="864" y2="896" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#202631"/>
      <stop offset="0.52" stop-color="#10141B"/>
      <stop offset="1" stop-color="#080A0E"/>
    </linearGradient>
    <linearGradient id="mark" x1="260" y1="250" x2="794" y2="800" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#76F1FF"/>
      <stop offset="0.5" stop-color="#32C9E8"/>
      <stop offset="1" stop-color="#7272FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="markGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="212" fill="#05070A" opacity="0.46" filter="url(#shadow)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#background)"/>
  <rect x="66" y="66" width="892" height="892" rx="210" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="4"/>

  <g filter="url(#markGlow)">
    <circle cx="500" cy="478" r="238" fill="none" stroke="url(#mark)" stroke-width="92" stroke-linecap="round"/>
    <path d="M584 596 L770 782" fill="none" stroke="url(#mark)" stroke-width="78" stroke-linecap="round"/>
  </g>

  <path d="M610 622 L770 782" fill="none" stroke="#D8FCFF" stroke-opacity="0.20" stroke-width="14" stroke-linecap="round"/>

  <g fill="#D9FCFF">
    <rect x="306" y="279" width="34" height="34" rx="10" transform="rotate(-18 323 296)"/>
    <rect x="367" y="240" width="42" height="42" rx="12" transform="rotate(-10 388 261)" opacity="0.88"/>
    <rect x="441" y="218" width="50" height="50" rx="14" opacity="0.76"/>
  </g>
</svg>
